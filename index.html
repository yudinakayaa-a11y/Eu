<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil do Yudi</title>
    <style>
        /* Fundo dark cyberpunk combinando com o print */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #060913, #0b1528);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Container principal com blur e neon azul */
        .profile-container {
            background: rgba(11, 21, 40, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 20px;
            padding: 30px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.15);
        }

        /* Foto de perfil com borda neon */
        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #00d4ff;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
            margin-bottom: 15px;
        }

        /* Assinatura de cima estilizada igual ao print */
        .top-signature {
            font-size: 13px;
            color: #00d4ff;
            margin-bottom: 5px;
            text-shadow: 0 0 5px rgba(0, 212, 255, 0.8);
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 13px;
            color: #00d4ff;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }

        /* Container do Print enviado */
        .screenshot-container {
            margin: 20px 0;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(0, 212, 255, 0.3);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .screenshot {
            width: 100%;
            display: block;
            height: auto;
        }

        /* Bloco com os seus textos */
        .phrases-box {
            background: rgba(0, 0, 0, 0.4);
            padding: 20px;
            border-radius: 12px;
            text-align: left;
            margin-top: 25px;
            border-left: 4px solid #00d4ff;
            box-shadow: inset 0 0 10px rgba(0, 0, 255, 0.1);
        }

        .phrases-box p {
            margin: 16px 0;
            font-size: 15px;
            line-height: 1.6;
            color: #e2e8f0;
        }

        .phrases-box p:first-child {
            margin-top: 0;
        }

        .phrases-box p:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <!-- Foto de Perfil temporária usando o mesmo print caso queira, ou mude para sua foto -->
        <img src="https://cdn.discordapp.com/attachments/1530693035472584851/1538658840893984798/Screenshot_20260816-1810004.jpg?ex=6a837b36&is=6a8229b6&hm=6e226cdf87382b4ecb5a6326ace2c0e85df1a66bb1b59584747b091b46625335&" alt="Foto de Perfil" class="profile-pic">

        <!-- Linha decorativa idêntica à do print -->
        <div class="top-signature">†•.═════•★ Yudi ★•═════.•†</div>
        
        <div class="subtitle">Online</div>

        <!-- O seu print do Gojo carregando direto do link do Discord -->
        <div class="screenshot-container">
            <img src="https://cdn.discordapp.com/attachments/1530693035472584851/1538658840893984798/Screenshot_20260816-1810004.jpg?ex=6a837b36&is=6a8229b6&hm=6e226cdf87382b4ecb5a6326ace2c0e85df1a66bb1b59584747b091b46625335&" alt="Print do Yudi" class="screenshot">
        </div>

        <!-- Suas Mensagens -->
        <div class="phrases-box">
            <p>⚡ "Do 0 ao 1 e do 1 ao infinito"</p>
            <p>✝️ "A maior prova de amor foi na cruz"</p>
            <p>🧠 "Não fique satisfeito com coisas que recebeu de mão beijada, mereça, não existe algo melhor do que conseguir e saber que você mereceu"</p>
        </div>
    </div>

</body>
</html>
