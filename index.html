<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil do Yudi</title>
    <style>
        /* Fundo dark cyberpunk combinando com o print */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #060913, #0b1528);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            transition: background 1.5s ease;
        }

        /* Estado Alterado do Fundo (Modo Oculto) */
        body.secret-mode {
            background: linear-gradient(135deg, #0a0507, #160a0f);
        }

        /* Container principal com blur e neon azul */
        .profile-container {
            background: rgba(11, 21, 40, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 20px;
            padding: 30px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.15);
            transition: all 1.5s ease;
        }

        /* Estado Alterado do Container */
        .profile-container.secret-mode {
            background: rgba(22, 10, 15, 0.65);
            border: 1px solid rgba(255, 50, 85, 0.15);
            box-shadow: 0 0 35px rgba(255, 50, 85, 0.1);
        }

        /* Foto de perfil com borda neon */
        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #00d4ff;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
            margin-bottom: 15px;
            transition: all 1.5s ease;
        }

        .profile-pic.secret-mode {
            border: 3px solid #ff3255;
            box-shadow: 0 0 20px rgba(255, 50, 85, 0.4);
        }

        /* Assinatura de cima estilizada contendo o BOTÃO SECRETO */
        .top-signature {
            font-size: 13px;
            color: #00d4ff;
            margin-bottom: 5px;
            text-shadow: 0 0 5px rgba(0, 212, 255, 0.8);
            letter-spacing: 1px;
            transition: all 1.5s ease;
        }

        .top-signature.secret-mode {
            color: #ff3255;
            text-shadow: 0 0 8px rgba(255, 50, 85, 0.6);
        }

        /* O botão secreto disfarçado no seu nome */
        .secret-trigger {
            background: none;
            border: none;
            color: inherit;
            font-family: inherit;
            font-size: inherit;
            cursor: pointer;
            padding: 0;
            text-shadow: inherit;
            font-weight: bold;
        }

        .secret-trigger:focus {
            outline: none;
        }

        .subtitle {
            font-size: 13px;
            color: #00d4ff;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
            transition: all 1.5s ease;
        }

        .subtitle.secret-mode {
            color: #ff3255;
            text-shadow: 0 0 5px rgba(255, 50, 85, 0.3);
        }

        /* Container do Print */
        .screenshot-container {
            margin: 20px 0;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(0, 212, 255, 0.3);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            transition: all 1.5s ease;
        }

        .screenshot-container.secret-mode {
            border: 1px solid rgba(255, 50, 85, 0.25);
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.7);
        }

        .screenshot {
            width: 100%;
            display: block;
            height: auto;
        }

        /* Bloco com as frases */
        .phrases-box {
            background: rgba(0, 0, 0, 0.4);
            padding: 20px;
            border-radius: 12px;
            text-align: left;
            margin-top: 25px;
            border-left: 4px solid #00d4ff;
            box-shadow: inset 0 0 10px rgba(0, 0, 255, 0.1);
            transition: all 1.5s ease;
        }

        .phrases-box.secret-mode {
            background: rgba(0, 0, 0, 0.55);
            border-left: 4px solid #ff3255;
            box-shadow: inset 0 0 15px rgba(255, 0, 50, 0.05);
        }

        .phrases-box p {
            margin: 16px 0;
            font-size: 15px;
            line-height: 1.6;
            color: #e2e8f0;
        }

        /* Estilos dinâmicos para o texto do desabafo */
        .vent-text {
            color: #f1f5f9;
            font-style: italic;
            border-bottom: 1px dashed rgba(255, 50, 85, 0.2);
            padding-bottom: 10px;
        }

        .typing-fast { animation: fadeInText 1.5s ease-out forwards; }
        .typing-slow { animation: fadeInText 4s ease-out forwards; color: #94a3b8; }

        @keyframes fadeInText {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
